# Builds the game and publishes it to combedowner.com. In the repo's Settings → Pages, Source must be
# "GitHub Actions" and the custom domain combedowner.com (there's no CNAME file): if the repo is ever
# made private and public again, Pages comes back as "Deploy from a branch" and shows the README.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # One job, not a build and a publish: each job is billed rounded up to a whole minute.
  build:
    runs-on: ubuntu-24.04
    # Pages only publishes from main; a run on another branch just checks the build.
    environment: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the build reads when web/ last changed, for the game's version
          filter: blob:none   # but only the files as they are now, not every old copy of the maps
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Packing all the map files takes most of the build, so keep the packs from the last run and
      # let the packer remake only those whose map file or format has changed.
      - uses: actions/cache@v4
        with:
          path: |
            web/public/maps/**/*.pack.gz
            web/public/maps/.packs.json
          key: map-packs-${{ hashFiles('web/src/pack.ts', 'web/public/maps/**/*.json') }}
          restore-keys: map-packs-
      - run: npm run build
        working-directory: web
        env:
          # Optional TURN relay for players whose networks block direct links (see web/src/net.ts).
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          # Optional anonymous play counts (web/src/telemetry.ts): the repo variable TELEMETRY_URL overrides where they go.
          VITE_TELEMETRY_URL: ${{ vars.TELEMETRY_URL || 'https://telemetry.combedowner.com/e' }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v5
      # The same build goes to Cloudflare Pages too. Each repo that publishes there says which branch it
      # publishes as in its CLOUDFLARE_BRANCH variable: `main` is combedowner.com, `test` is
      # test.combedowner.pages.dev. A repo without it skips these.
      - if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_BRANCH != ''
        name: Make sure the Cloudflare Pages project is there
        continue-on-error: true   # it fails once the project exists, which is fine
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create combedowner --production-branch=main
      - if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_BRANCH != ''
        name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=combedowner --branch=${{ vars.CLOUDFLARE_BRANCH }} --commit-dirty=true
